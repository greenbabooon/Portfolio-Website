<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project — Details</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <script src="../js/visual-handler.js" defer></script>
    <script src="../js/project.js" defer></script>
  </head>
  <body>
    <main class="container project-detail" id="glow">
      <h2 id="project-title">Loading…</h2>
      <div class="project-video-container">
        <div id="project-video-wrapper"></div>
      </div>
      <section class="project-hero">
        <div class="hero-meta">
          <p id="project-date" class="project-date"></p>

          <div id="project-tags" class="project-tags"></div>

          <div id="project-links" class="project-links"></div>
        </div>

        <figure class="hero-media">
          <img
            id="project-image"
            src="../../assets/placeholder.png"
            alt="Project screenshot"
          />
        </figure>
      </section>
      <section class="project-overview">
        <h3>Overview</h3>
        <p id="project-description"></p>
      </section>

      <section class="project-details">
        <h3>About This Game:</h3>
        <p id="project-about"></p>

        <h3>Technical Details:</h3>
        <p id="project-tech"></p>

        <h3>Downloads & Links:</h3>
        <div id="project-downloads" class="project-downloads"></div>

        <h3>Contributors:</h3>
        <p id="project-contributors"></p>
      

      <p class="back-link"><a href="../projects.html">← Back to projects</a>
    </p></section>
    </main>
  </body>
</html>
